# Configuración de CodeRabbit para el Marketplace de Inversiones LR.
# Documentación: https://docs.coderabbit.ai
language: es-ES

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_instructions:
    - path: "backend/**/*.java"
      instructions: >-
        Arquitectura de puertos y adaptadores (ADR-1). Señala cualquier
        dependencia que vaya del dominio hacia la infraestructura: el dominio no
        debe importar clases de persistencia, de la pasarela de pagos ni de web.
        Revisa que las operaciones que crean o confirman reservas sean
        idempotentes y que ninguna consulta de disponibilidad omita la
        revalidación al confirmar (ASR-1, ASR-3).
    - path: "backend/**/*Controller.java"
      instructions: >-
        Toda operación debe declarar explícitamente los roles que pueden usarla
        (ADR-5). Marca cualquier endpoint sin anotación de autorización.
    - path: "frontend/**/*.jsx"
      instructions: >-
        La interfaz no contiene reglas de negocio: todo cálculo de precios,
        disponibilidad o estados lo decide la API. Señala lógica de negocio
        duplicada en el cliente.
    - path: "**/*.sql"
      instructions: >-
        La restricción de exclusión que impide reservas superpuestas vive en la
        base de datos (ADR-3). Revisa que ninguna migración la debilite o la
        sustituya por una verificación en código.

chat:
  auto_reply: true
