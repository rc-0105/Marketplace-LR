# Los valores de organización y clave se definen como variables del repositorio
# y los inyecta el workflow; aquí solo van las rutas.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.jsx,src/**/*.test.js
sonar.exclusions=src/**/*.test.jsx,src/**/*.test.js,src/main.jsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
