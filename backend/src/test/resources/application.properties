# Each cached Spring test context keeps its own Hikari pool. With many distinct contexts the
# default pool (10 connections held open per context) exhausts PostgreSQL max_connections
# ("too many clients already"). Idle connections are released so cached contexts hold none;
# the maximum still fits the concurrent-request tests (6 simultaneous requests).
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
