spring:
  application:
    name: marketplace-app
  # Las credenciales llegan solo por variables de entorno (RNF-17).
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    # Flyway es dueño del esquema; Hibernate solo verifica que coincida.
    hibernate:
      ddl-auto: validate

server:
  port: ${PUERTO:8080}

# Contrato OpenAPI que exige el enunciado.
#   JSON: /v3/api-docs      interfaz: /swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  # Sin esto, /actuator/health intentaría conectarse al SMTP aunque el correo esté en modo log.
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

# El formato JSON de los logs vive en logback-spring.xml (RF-45, RNF-24). Cada
# línea lleva el identificador de correlación que pone FiltroCorrelacion, que es
# lo que permite seguir una petición de punta a punta.
logging:
  level:
    co.edu.unbosque.marketplace: INFO

# Los JWT los firma la propia aplicación (HS256). El secreto es obligatorio, de al
# menos 32 bytes, y llega solo por entorno (RNF-17, REQ-A11).
jwt:
  secreto: ${JWT_SECRET}
  expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}
  emisor: ${spring.application.name}

# Envío del código de recuperación (RF-05). Con "log" el código se escribe en la
# consola; con "smtp" se envía por correo usando spring.mail. Las credenciales
# llegan solo por entorno (RNF-17).
correo:
  modo: ${CORREO_MODO:log}
  # Si MAIL_FROM falta o está vacío, se usa MAIL_USERNAME.
  remitente: ${MAIL_FROM:}

spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true
    # Nunca enviar la contraseña sin cifrar si el servidor no ofrece STARTTLS.
    mail.smtp.starttls.required: true
    mail.smtp.connectiontimeout: 5000
    mail.smtp.timeout: 5000
    mail.smtp.writetimeout: 5000
