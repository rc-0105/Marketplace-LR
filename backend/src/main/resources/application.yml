spring:
  application:
    name: marketplace-app
  # Las credenciales llegan solo por variables de entorno (RNF-17).
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  # Las imágenes de las publicaciones pesan a lo sumo 5 MB (SubidaImagenService); el resto del
  # cuerpo multipart es poco más que el archivo.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
    # Flyway es dueño del esquema; Hibernate solo verifica que coincida.
    hibernate:
      ddl-auto: validate

server:
  port: ${PUERTO:8080}

# Commit desplegado, visible en /api/estado. Render lo publica en RENDER_GIT_COMMIT;
# VERSION_COMMIT permite fijarlo en otro entorno.
aplicacion:
  version: ${VERSION_COMMIT:${RENDER_GIT_COMMIT:desarrollo}}

# Contrato OpenAPI que exige el enunciado.
#   JSON: /v3/api-docs      interfaz: /swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  # Sin esto, /actuator/health intentaría conectarse al SMTP aunque el correo esté en modo log.
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

# El formato JSON de los logs vive en logback-spring.xml (RF-45, RNF-24). Cada
# línea lleva el identificador de correlación que pone FiltroCorrelacion, que es
# lo que permite seguir una petición de punta a punta.
logging:
  level:
    co.edu.unbosque.marketplace: INFO

# Los JWT los firma la propia aplicación (HS256). El secreto es obligatorio, de al
# menos 32 bytes, y llega solo por entorno (RNF-17, REQ-A11).
jwt:
  secreto: ${JWT_SECRET}
  expiracion-minutos: ${JWT_EXPIRACION_MINUTOS:60}
  emisor: ${spring.application.name}

# Reservas (SOF-33, ADR-4): una reserva PENDIENTE aparta las noches solo este tiempo; si no se
# confirma (el pago es aparte) pasa a VENCIDA y libera las noches.
marketplace:
  reservas:
    minutos-apartado: ${RESERVAS_MINUTOS_APARTADO:15}
    # Aprobación de reservas (SOF-79, RF-52): el anfitrión tiene horas-aprobacion para responder una solicitud
    # (si no, pasa a VENCIDA); al aprobarla, el huésped tiene horas-pago-aprobada para pagarla.
    horas-aprobacion: ${RESERVAS_HORAS_APROBACION:24}
    horas-pago-aprobada: ${RESERVAS_HORAS_PAGO_APROBADA:24}
    # Cierre de reservas (SOF-78, RF-50): cada este intervalo, pasa a COMPLETADA toda reserva
    # CONFIRMADA cuya fecha de salida ya pasó, lo que habilita la reseña y la saca de la
    # restricción de exclusión (una vez al día por defecto).
    cierre:
      intervalo-horas: ${RESERVAS_CIERRE_INTERVALO_HORAS:24}
  # Idempotencia (SOF-77, HU-32): la respuesta de una clave se replica durante horas-vigencia; una clave
  # EN_PROCESO se considera huérfana pasados segundos-reclamo; segundos-reintento es el Retry-After del 409.
  idempotencia:
    horas-vigencia: ${IDEMPOTENCIA_HORAS_VIGENCIA:24}
    segundos-reclamo: 120
    segundos-reintento: 2

# Pago de la reserva (SOF-34, RF-37). "simulado" (por defecto) responde sin red como Stripe a sus
# tarjetas de prueba; "stripe" usa Stripe en modo prueba y exige una clave sk_test_ (nunca pagos
# reales). Si la pasarela no responde en tiempo-espera-segundos, la reserva sigue PENDIENTE.
pagos:
  modo: ${PAGOS_MODO:simulado}
  tiempo-espera-segundos: ${PAGOS_TIEMPO_ESPERA_SEGUNDOS:10}
  stripe:
    clave-prueba: ${STRIPE_CLAVE_PRUEBA:}
  # Cada intervalo, la conciliación le pregunta a la pasarela por los pagos en ERROR: confirma la
  # reserva si cobró y sigue PENDIENTE, o reembolsa si ya no lo está. Sin cobro tras el apartado más
  # la gracia, cierra el pago como NO_COBRADO.
  conciliacion:
    intervalo-minutos: ${PAGOS_CONCILIACION_INTERVALO_MINUTOS:5}
    gracia-minutos: ${PAGOS_CONCILIACION_GRACIA_MINUTOS:60}

# Envío del código de recuperación (RF-05). Con "log" el código se escribe en la
# consola; con "smtp" se envía por correo usando spring.mail. Las credenciales
# llegan solo por entorno (RNF-17).
correo:
  modo: ${CORREO_MODO:log}
  # Si MAIL_FROM falta o está vacío, se usa MAIL_USERNAME.
  remitente: ${MAIL_FROM:}

spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true
    # Nunca enviar la contraseña sin cifrar si el servidor no ofrece STARTTLS.
    mail.smtp.starttls.required: true
    mail.smtp.connectiontimeout: 5000
    mail.smtp.timeout: 5000
    mail.smtp.writetimeout: 5000
