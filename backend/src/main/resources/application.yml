spring:
  application:
    name: marketplace-app

server:
  port: ${PUERTO:8080}

# Contrato OpenAPI que exige el enunciado.
#   JSON: /v3/api-docs      interfaz: /swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

# El formato JSON de los logs vive en logback-spring.xml (RF-45, RNF-24). Cada
# línea lleva el identificador de correlación que pone FiltroCorrelacion, que es
# lo que permite seguir una petición de punta a punta.
logging:
  level:
    co.edu.unbosque.marketplace: INFO

# La configuración de la base de datos entra cuando se agregue JPA.
# El pipeline ya levanta un PostgreSQL 16 y expone estas variables:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
